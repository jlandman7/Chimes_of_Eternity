name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Trigger on pushes to the main branch

# Required permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build WebAssembly
        run: |
          mkdir build
          cd build
          
          # Run CMake using Emscripten's compiler wrappers
          emcmake cmake ..
          emmake make
          
          # Create the public directory and move the compiled web files there
          cd ..
          mkdir public
          
          # Rename the HTML file to index.html so GitHub Pages serves it automatically
          mv build/Chimes_of_Eternity.html public/index.html
          mv build/Chimes_of_Eternity.js public/
          mv build/Chimes_of_Eternity.wasm public/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4